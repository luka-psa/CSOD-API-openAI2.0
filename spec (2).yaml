openapi: 3.1.0
info:
  title: Connectors
servers:
- url: https://{subdomain}.csod.com/{callback URL}
paths:
  /course-asset-connector-course-list:
    get:
      summary: Course List
      tags:
      - Course Asset Connector
      responses:
        '200':
          description: 'Your response to the "course-list" query must be a JSON object
            with an array of course objects that contain course metadata.


            If any metadata for a course has been modified, all the fields in the
            metadata for each course should be included in the JSON object (and not
            just the fields that changed). Cornerstone compares the received data
            with stored data and then modifies the stored data accordingly.


            Metadata fields labeled "Required for Content Anytime Providers" are OPTIONAL
            for non-Content Anytime Providers but highly recommended, as they improve
            the user experience.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course-Asset-Connector-Course-List'
              examples:
                Get Course List:
                  value:
                  - ID: 00000000-0000-0000-0000-000000000001
                    Title: Example Course
                    DownloadPackageURL: https://ExampleProvider.com/download/example-course.zip
                    IsActive: true
                    Description: This is text describing the example course.
                    Thumbnail: https://ExampleProvider.com/example-course/image.png
                    Version: '1.0'
                    Languages:
                    - en-US
                    - es-ES
                    - fr-FR
                    LastModifiedUTC: '2017-11-23T08:38:54.7573396+00:00'
                    PackageLastModifiedUTC: '2017-11-23T08:38:54.7573396+00:00'
                    Duration: 00:30:00
                    Subjects:
                    - Personal Development
                    Keywords: example, illustration, definition
                    IsMobile: true
                    MaxProficiency: 5.0
                    Proficiency: 3.4
                    AccreditationBody: ISO (International Organization for Standardization)
                    CertificationPoints: 14.7
                    CertificationPointUnitOfMeasure: hours
                    PublicationDate: '2017-12-26T08:38:54.7573396+00:00'
                    Localization:
                    - Title: example course
                      Description: description
                      AccreditationBody: ISO
                      CertificationPointUnitOfMeasure: hours
                      Language: en-US
                      Keywords: example, content
                    - Title: curso de ejemplo
                      Description: "descripci\xF3n"
                      Language: es-ES
                      Keywords: "ejemplo, espa\xF1ol"
                    - Title: exemple de cours
                      Description: "description du cours \xE0 \xE9crire en fran\xE7\
                        ais"
                      Language: fr-FR
                      Keywords: "fran\xE7ais, contenu"
                    Modalities:
                    - Watch
                    - Read
                    SeriesCollection: 2020BusinessExpert,SSExpert2_Codecademy,SkillsoftEssentialsPlus
                  - <Data of Course 2>: null
                  - '...'
        '304':
          description: If Cornerstone includes the If-Modified-Since header in the
            request and if no courses were modified or added in your system since
            that datetime, you must respond with an HTTP 304 (Not Modified).
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples: {}
      operationId: course-asset-connector-get-course-list
      description: 'The Course List is a JSON object containing the list of newly
        created and updated courses. You must setup an endpoint that allows Cornerstone
        to GET the list of new/updated courses from your system.


        The path mentioned here is only an example. You can set up a URL path of your
        choice. Once you have it set up, you will need to communicate the URL to Cornerstone''s
        Content Services Team.

        For any Sync Failures Providers will be [notified by email](https://csod.dev/guides/connectors/content/#connector-types) '
      parameters:
      - schema:
          type: string
          format: date-time
          example: Fri, 16 May 2015 05:50:06 GMT
        in: header
        name: If-Modified-Since
        description: Custom header parameter. Datetime in ddd, dd MMM yyy HH:mm:ss
          GMT format. If this field is included in the request from Cornerstone, your
          response must only include the updated/newly created courses since the value
          included in this header. If this field is empty (empty string or null value),
          or is not included in the header, your response must include the full list
          of courses from your system, <b>including those that are inactive or have
          been removed</b>.
