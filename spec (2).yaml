          type: string
          maxLength: 1000
          description: 'The placeholder for the catalog information for the courses.
            CSOD adds the courses in different subscriptions and this value will help
            the curation to add the courses in relevant subscriptions. For example
            - "SeriesCollection": "2020BusinessExpert,SSExpert2_Codecademy,SkillsoftEssentialsPlus"
            This particular course will go in the Business Expert and Essentials Plus
            catalog from Skillsoft.'
      required:
      - ID
      - Title
      - URL
      - IsActive
      - Description
      - LastModifiedUTC
      - IsMobile
      - Languages
    LTI-Connector-Course-List:
      title: Online Content Connector Course List
      type: object
      description: ''
      examples: []
      properties:
        ID:
          type: string
          description: 'Unique course ID

            IDs with the following characters are not allowed: . | \ / < > " % & and
            whitespace.'
          maxLength: 50
        Title:
          type: string
          maxLength: 500
          description: Course title
        URL:
          type: string
          description: Course URL. Cornerstone uses the course URL to redirect users
            to the content partner's course. If you have an SSO setup with Cornerstone,
            include the correctly formatted path, including the base URL in this field.
          maxLength: 1000
          format: uri
        IsActive:
          type: boolean
          format: email
          description: True if course is active and available. Should be false for
            retired courses that are no longer available.
        Description:
          type: string
          description: Course description. Supports HTML tags. Descriptions with over
            5000 characters will result in an HTML tag removal and might later be
            cut to 5000 characters.
        Proficiency:
          type: double>=0.1
          description: Difficulty level of the course. Supports up to one decimal.
        MaxProficiency:
          type: double>=0.1
          description: <span style="color:red;">Required when entering a value for
            the Proficiency field. </span><br/> Max Difficulty level of courses. Used
            to normalize the Proficiency field. Supports up to one decimal.
        AccreditationBody:
          type: string
          description: The organization that provides the formal recognition for the
            course's credits.
        CertificationPoints:
          type: double>=0.1
          description: Number of credits received by the user when finishing the course.
        CertificationPointUnitOfMeasure:
          type: string
          description: Credit point unit name.
        Thumbnail:
          type: string
          description: "URL of the course thumbnail image. Thumbnail recommended size\
            \ is 120KB for quick loading. Recommended image dimensions: Aspect ratio\
            \ of 2:1, and image size of 660x336. The minimum recommended size is 220x112.\
            \ Supported image types: bmp, gif, jpg, jpeg, and png. Required for Content\
            \ Anytime Providers. Please ensure that URI contain only basic ASCII characters\
            \ (0\u2014127), including standard letters, digits, and common symbol"
          maxLength: 1000
          format: uri
        Version:
          type: string
          maxLength: 50
          description: Course version
        Languages:
          type: array
          format: date-time
          description: Array of strings containing the RFC 1766 available language
            tags for the course. These determine where the course will show in search
            results, when filtered by language. The first valid available language
            in the array will be the course's default language. If none of the languages
            are valid and available, the record will be rejected. See supported language
            codes for the list of valid values. Required for Content Anytime Providers.
          items:
            type: string
        Duration:
          type: string
          description: Course duration in hh:mm:ss. Required for Content Anytime Providers.
          format: time
        MasteryScore:
          description: The minimal score required to pass a course.
          type: integer
        MaxScore:
          description: Positive value indicating the maximum score possible for this
            activity.
          type: integer
        Subjects:
          type: array
          description: Array of strings. Courses may be mapped to subjects provided
            by Cornerstone. For subscription providers, see the [Subject Taxonomy](https://csod.dev/guides/connectors/content/basic-concepts.html#subject-taxonomy)
            for a list of valid subjects. A single course may be mapped to multiple
            subjects. Required for subscription Providers.
          items:
            type: string
        Keywords:
          type: string
          maxLength: 1000
          description: Words or phrases associated with the course. Allows users to
            search using keywords in Cornerstone. Keywords and phrases must be separated
            by commas. Required for Content Anytime Providers.
        IsMobile:
          type: boolean
          description: True if course is mobile compatible. Should be false if course
            is not mobile compatible.
        Localization:
          type: array
          description: Array of translation objects for the course Title, Description,
            Keywords, Accreditation Body, and Certification Point Unit Of Measure.
            See localization for further details. Required for Content Anytime Providers.
          items:
            $ref: '#/components/schemas/Localization'
        Modalities:
          type: array
          description: Array of strings. Courses may be mapped to modalities (e.g.
            "Watch", "Read") provided by Cornerstone. See [modalities](https://csod.dev/guides/connectors/content/basic-concepts.html#modalities)
            for a list of valid modalities. A single course may be mapped to multiple
            modalities.
          items:
            type: string
        SeriesCollection:
          type: string
          maxLength: 1000
          description: 'The placeholder for the catalog information for the courses.
            CSOD adds the courses in different subscriptions and this value will help
            the curation to add the courses in relevant subscriptions. For example
            - "SeriesCollection": "2020BusinessExpert,SSExpert2_Codecademy,SkillsoftEssentialsPlus"
            This particular course will go in the Business Expert and Essentials Plus
            catalog from Skillsoft.'
        Custom:
          type: Key-Value Collection
          description: A map of key/value custom parameters. Map values must be strings.
          items:
            type: key-value pairs
      required:
      - ID
      - Title
      - URL
      - IsActive
      - Description
      - LastModifiedUTC
      - Languages
      - IsMobile
    Localization:
      title: Localization
      type: object
      properties:
        Language:
          type: string
          description: Language code. See supported language codes for a list of valid
            values.
        Title:
          type: string
          description: Translated course title.
        AccreditationBody:
          type: string
          description: The organization that provides the formal recognition for the
            course's credits.
        CertificationPointUnitOfMeasure:
          type: string
          description: Credit point unit name.
        Description:
          type: string
          description: Translated course description. Supports HTML tags. Descriptions
            with over 5000 characters will result in an HTML tag removal and might
            later be cut to 5000 characters.
        Keywords:
          type: string
          description: Translated keywords. Required for Content Anytime Providers.
      required:
      - Language
      - Title
      - Description
    Progress:
      title: Progress
      type: object
      properties:
        id:
          type: string
    AICC-Structure:
      title: AICC-Structure
      type: object
      properties:
        course_description:
          type: object
          description: Contains information that applies to the course as a whole.
            Some of this data is designed to help in processing the more detailed
            information on other data elements in the course and how they are ordered.
            Refer to the AICC specification for a list of fields in this object and
            associated descriptions.  Supports HTML tags. Descriptions with over 5000
            characters will result in an HTML tag removal and might later be cut to
            5000 characters.
        descriptor:
          type: array
          description: Array of Course Elements. A Course Element is an Assignable
            Unit, a Block, or an Objective. Has information about individual Course
            Elements and indicates how those Course Elements are organized and how
            they relate to one another. Refer to the AICC specification for a list
            of fields in this object and associated descriptions.
          items: {}
        assignable_unit:
          type: array
          description: Array of assignable unit objects. Refer to the AICC specification
            for a list of fields in this object and associated descriptions.
          items: {}
        course_structure:
          type: object
          description: Array of assignable unit groups. Refer to the AICC specification
            for a description of the course structure.
      required:
      - course_description
      - descriptor
      - assignable_unit
      - course_structure
    Metadata:
      title: Metadata
      type: object
      description: Additional metadata not covered by the AICC specification.
      properties:
        languages:
          type: array
          description: Array of strings containing the RFC 1766 available language
            tags for the course. These determine where the course will show in search
            results, when filtered by language. The first valid available language
            in the array will be the course's default language. If none of the languages
            are valid and available, the record will be rejected. See supported language
            codes for the list of valid values. Required for Content Anytime Providers.
          items:
            type: string
        is_mobile:
          type: boolean
          description: True if course is mobile compatible and is designed with responsive
            properties. Should be false if course is not mobile compatible.
        duration:
          type: string
          description: Course duration in hh:mm:ss. This field is displayed in Cornerstone
            LMS and enables admins and learners to filter courses by their duration.
            Required for Content Anytime Providers.
        format: time
        accreditation_body:
          type: string
          description: The organization that provides the formal recognition for the
            course's credits.
        certification_points:
          type: double>=0.1
          description: Number of credits received by the user when finishing the course.
        certification_point_unit_of_measure:
          type: string
          description: Credit point unit name.
        proficiency:
          type: double>=0.1
          description: Difficulty level of the course. Supports up to one decimal.
        max_proficiency:
          type: double>=0.1
          description: <span style="color:red;">Required when entering a value for
            the Proficiency field. </span><br/> Max Difficulty level of courses. Used
            to normalize the Proficiency field. Supports up to one decimal.
        image:
          type: string
          description: "URL of the course thumbnail image. Thumbnail recommended size\
            \ is 120KB for quick loading. Recommended image dimensions: Aspect ratio\
            \ of 2:1, and image size of 660x336. The minimum recommended size is 220x112.\
            \ Supported image types: bmp, gif, jpg, jpeg, and png. Required for Content\
            \ Anytime Providers. Please ensure that URI contain only basic ASCII characters\
            \ (0\u2014127), including standard letters, digits, and common symbol"
          maxLength: 2000
          format: uri
        subjects:
          type: array
          description: Array of strings. Courses may be mapped to subjects provided
            by Cornerstone. For subscription providers, see the [Subject Taxonomy](https://csod.dev/guides/connectors/content/basic-concepts.html#subject-taxonomy)
            for a list of valid subjects. A single course may be mapped to multiple
            subjects. Required for subscription Providers.
          items:
            type: string
        modalities:
          type: string
          description: Array of strings. Courses may be mapped to modalities (e.g.
            "Watch", "Read") provided by Cornerstone. See [modalities](https://csod.dev/guides/connectors/content/basic-concepts.html#modalities)
            for a list of valid modalities. A single course may be mapped to multiple
            modalities.
        last_modified_utc:
          type: string
          format: date-time
          description: Datetime in YYYY-MM-DDTHH:MM:SS.mmmZZ:ZZ format. Time of the
            last modification made to a course in UTC.
        keywords:
          type: string
          description: Words or phrases associated with the course. Allows users to
            search using keywords in Cornerstone. Keywords and phrases can be separated
            by commas. Required for Content Anytime Providers.
          maxLength: 1000
        Localization:
          type: array
          description: Array of translation objects for the course Title, Description,
            Keywords, Accreditation Body, and Certification Point Unit Of Measure.
            See localization for further details. Required for Content Anytime Providers.
          items:
            $ref: '#/components/schemas/Localization'
      required:
      - is_mobile
      - last_modified_utc
    AddInstructorRequest:
      type: object
      required:
      - Email
      - FirstName
      - LastName
      properties:
        Email:
          type: string
          description: Instructor's email address
        FirstName:
          type: string
          description: Instructor's first name
        LastName:
          type: string
          description: Instructor's last name
    UpdateInstructorRequest:
      type: object
      required:
      - OldEmail
      - NewEmail
      - FirstName
      - LastName
      properties:
        OldEmail:
          type: string
          description: Current email address of the instructor in the virtual meeting
            provider's system.
        NewEmail:
          type: string
          description: New email address of the instructor in the virtual meeting
            provider's system.
        FirstName:
          type: string
          description: Instructor's first name
        LastName:
          type: string
          description: Instructor's last name
        IsActive:
          type: boolean
          description: Indicates if the instructor's record is active.
    SessionRequest:
      type: object
      required:
      - CreatorEmail
      - Title
      - DateBegin
      - DateEnd
      - TimeZone
      - InstructorEmails
      - SessionId
      - LoId
      properties:
        CreatorEmail:
          type: string
          description: Email address of the person creating the session.
        Title:
          type: string
          description: Title of the session. Maximum length = 50 characters.
        Description:
          type: string
          description: Description of the session. Maximum length = 100 characters.
        DateBegin:
          type: string
          description: Start date and time of the session in UTC. Format is YYYY-MM-DDTHH:MM:SS.
        DateEnd:
          type: string
          description: End date and time of the session in UTC. Format is YYYY-MM-DDTHH:MM:SS.
        TimeZone:
          $ref: '#/components/schemas/TimeZone'
        InstructorEmails:
          type: array
          items:
            type: string
            description: List of email ids of all the instructors assigned for the
              session.
        ExtendedOptions:
          $ref: '#/components/schemas/ExtendedOptions'
        SessionId:
          type: string
          description: Unique ID for the session generated by Cornerstone. This ID
            is referenced in subsequent workflows by Cornerstone must be saved in
            the virtual meeting provider's system.
        LoId:
          type: string
          description: Super set for the session generated by Cornerstone.
    TimeZone:
      type: object
      required:
      - UTCOffset
      properties:
        UTCOffset:
          type: string
          description: Offset value from UTC.
      example:
        UTCOffset: (UTC-08:00) Pacific Time (US & Canada)
    ExtendedOptions:
      type: array
      items:
        type: object
        required:
        - Type
        - Id
        - ParentId
        - Name
        properties:
          Type:
            type: string
            description: Type of control. Valid values are checkbox, label, radiobutton,
              textbox
          Id:
            type: string
            description: Valid value to uniquely identify control
          ParentId:
            type: string
            description: Should be empty for root and rest should have value of Id
          Name:
            type: string
            description: Text to display on UI
          Description:
            type: string
            description: More description about the control to show on UI
          Placeholder:
            type: string
            description: Placeholder text to be displayed. Valid only for textbox
              control.
          Value:
            type: string
            description: Default value to be shown. Valid only for textbox control.
          IsNameVisible:
            type: boolean
            description: This is to control the visibility of name on UI
          IsMultiline:
            type: boolean
            description: User to render Textbox control as muitiline (Textarea)
          IsChecked:
            type: boolean
            description: Checkbox or Radiobutton are checked or not
          ChildExtendedOption:
            type: array
            items:
              $ref: '#/components/schemas/ExtendedOptions'
    ViltConnectorSuccessResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: Only accepted value is 'Success' for HTTP 200 responses.
        correlationId:
          type: string
          description: Ideally should match the unique identifier included in the
            request from Cornerstone. Useful for debugging purposes.
        timestamp:
          type: string
          description: Date and time of the response in UTC. Format expected is YYYY-MM-DDTHH:mm:ss.SSS+00:00.
    ViltConnectorErrorResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: Indicates whether the request was successful. Accepted values
            are PartialSuccess, ValidationError, and SystemError
        correlationId:
          type: string
          description: Ideally should match the unique identifier included in the
            request from Cornerstone. Useful for debugging purposes.
        timestamp:
          type: string
          description: Date and time of the response in UTC. Format expected is YYYY-MM-DDTHH:mm:ss.SSS+00:00.
        error:
          $ref: '#/components/schemas/ViltConnectorError'
    ViltConnectorLaunchSessionSuccessResponse:
      type: object
      required:
      - status
      - data
      properties:
        status:
          type: string
          description: Only accepted value is 'Success' for HTTP 200 responses.
        correlationId:
          type: string
          description: Ideally should match the unique identifier included in the
            request from Cornerstone. Useful for debugging purposes.
        timestamp:
          type: string
          description: Date and time of the response in UTC. Format expected is YYYY-MM-DDTHH:mm:ss.SSS+00:00.
        data:
          $ref: '#/components/schemas/ViltConnectorLaunchSessionData'
    ViltConnectorLaunchSessionData:
      type: object
      required:
      - joinUrl
      properties:
        joinUrl:
          type: string
          description: URL a user or instructor uses to launch the virtual meeting
            session
    ViltConnectorGetAttendanceSuccessResponse:
      type: object
      required:
      - status
      - data
      properties:
        status:
          type: string
          description: Only accepted value is 'Success' for HTTP 200 responses.
        correlationId:
          type: string
          description: Ideally should match the unique identifier included in the
            request from Cornerstone. Useful for debugging purposes.
        timestamp:
          type: string
          description: Date and time of the response in UTC. Format expected is YYYY-MM-DDTHH:mm:ss.SSS+00:00.
        data:
          $ref: '#/components/schemas/ViltConnectorGetAttendanceData'
    ViltConnectorGetAttendanceData:
      type: object
      required:
      - attendees
      properties:
        attendees:
          type: array
          items:
            type: object
            properties:
              email:
                type: string
                description: Email address of the attendee.
    ViltConnectorGetExtendedOptionsSuccessResponse:
      type: object
      required:
      - status
      - data
      properties:
        status:
          type: string
          description: Only accepted value is 'Success' for HTTP 200 responses.
        correlationId:
          type: string
          description: Ideally should match the unique identifier included in the
            request from Cornerstone. Useful for debugging purposes.
        timestamp:
          type: string
          description: Date and time of the response in UTC. Format expected is YYYY-MM-DDTHH:mm:ss.SSS+00:00.
        data:
          $ref: '#/components/schemas/ViltConnectorGetExtendedOptionsData'
    ViltConnectorGetExtendedOptionsData:
      type: object
      required:
      - extendedOptions
      properties:
        extendedOptions:
          $ref: '#/components/schemas/ExtendedOptions'
    ViltConnectorError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: Error code. Accepted values include 400 (InvalidData), 401
            (Unauthorized), 403 (Forbidden), 404 (ResourceNotFound), and 500 (SystemError).
        message:
          type: string
          description: Descriptive message explaining the error. This message is displayed
            in the Cornerstone UI to the end user.
  securitySchemes:
    bearerAuth:
      description: '[Authentication Page](https://csod.dev/guides/connectors/content/authentication.html)'
      type: http
      scheme: bearer
security:
- bearerAuth: []
