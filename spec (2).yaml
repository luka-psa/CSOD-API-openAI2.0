  /progress:
    post:
      tags:
      - Online Content Connector
      summary: User Progress API
      operationId: online-course-connector-post-user-progress
      description: "The User Progress API enables content partners to report the end-users'\
        \ progress data to the Cornerstone LMS. With this API, it is possible to track\
        \ bookmarking and provide the user status and score for each Online Content\
        \ LO.                        \n\n</br><b>Authentication</b></br>\nUser Progress\
        \ API supports basic authentication using a session token that is valid for\
        \ 120 minutes, and an authorization header. The User Progress API also supports\
        \ <a href=\"https://help.csod.com/help/csod_0/Content/Edge/Integration_Center/API_Management_Page/API_Authentication.htm\"\
        >OAuth 2.0</a>"
      responses:
        '200':
          description: A "full success" response (HTTP 200) includes a data array
            with the list of user IDs, GUIDs, course IDs and success statuses. Use
            this information to validate that your POST request went through, and
            that all records were processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Full Success:
                  value:
                    status: Success
                    timestamp: '2019-05-02T13:59:26.6541369Z'
                    data:
                    - ID: ID7c0085c1-c9a3-448b-b1e5-766f2822222
                      userId: 1
                      userGuid: '2BCA8706-E070-4BFD-B8BE-0972234354AB '
                      courseId: ID7c0085c1-c9a3-448b-b1e5-766f2822222_0_990
                      completionDate: '2018-09-17T14:51:01.798Z'
                      status: Success
                      errorMessage: null
                      errorType: N/A
        '207':
          description: A "partial success" response (HTTP 207) includes a data array
            with the list of user IDs, GUIDs, course IDs and statuses. Use this information
            to validate that your POST request went through, which records were processed
            successfully, and which records failed (with explanations for the failures).
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Partial Success:
                  value:
                    status: Multi-Status
                    timestamp: '2019-05-02T13:59:26.6541369Z'
                    data:
                    - ID: ID7c0085c1-c9a3-448b-b1e5-766f2822222
                      userId: 1
                      userGuid: 2BCA8706-E070-4BFD-B8BE-0972234354AB
                      courseId: ID7c0085c1-c9a3-448b-b1e5-766f2822222_0_990
                      completionDate: '2018-09-17T14:51:01.798Z'
                      status: Success
                      errorMessage: null
                      errorType: N/A
                    - ID: ID7c0085c1-c9a3-448b-b1e5-766f2822223
                      userId: 1
                      userGuid: 2BCA8706-E070-4BFD-B8BE-0972234354AC
                      courseId: ID7c0085c1-c9a3-448b-b1e5-766f2822223_0_991
                      completionDate: '2018-09-17T14:51:01.798Z'
                      status: Failed
                      errorMessage: User 2BCA8706-E070-4BFD-B8BE-0972234354AC does
                        not Exist
                      errorType: UserDoesNotExist
        '400':
          description: 'An "all failed" response (HTTP 400) indicates that no records
            were processed successfully. The response body will contain details about
            the error(s).


            If a field in your request payload fails validation, you will see an HTTP
            400 error. The response body will contain details about the error.


            Types of Progress Errors in Response (values for errorType)

            N/A: Progress recorded successfully.

            UnspecifiedError: Internal error unrelated to the cases below.

            UserDoesNotExist: The user does not exist in the portal.

            CourseDoesNotExist: The course does not exist in the portal.

            CourseNotOnUserTranscript: The user is not registered in the course.

            CourseStatusNotSupported: The course exists in the portal''s course catalog,
            however it is in one of the following unsupported statuses: Disapproved,
            Deleted, Tentative, Unknown


            Please review user progress API response and connect with DLTechnicalContentConsultants@csod.com
            in case of 4xxs'
          content:
            application/json:
              schema:
                type: object
              examples:
                Validation Error:
                  value:
                    status: ValidationError
                    timestamp: '2019-05-02T14:02:10.4722094Z'
                    correlationId: 3eec1b71-b3ce-4a38-a476-7ae080738408
                    error:
                      code: InvalidData
                      message: null
                      fields:
                      - field: progresses[0].bookmark
                        errors:
                        - errorCode: 10
                          message: 'Invalid character after parsing property name.
                            Expected '':'' but got: ". Path ''[0].bookmark'', line
                            12, position 2.'
                All Failed:
                  value:
                    status: Failed
                    timestamp: '2019-05-02T13:59:26.6541370Z'
                    data:
                    - ID: ID7c0085c1-c9a3-448b-b1e5-766f2822222
                      userId: 1
                      userGuid: 2BCA8706-E070-4BFD-B8BE-0972234354AC
                      courseId: ID7c0085c1-c9a3-448b-b1e5-766f2822222_0_991
                      completionDate: '2018-09-17T14:51:01.798Z'
                      status: Failed
                      errorMessage: User 2BCA8706-E070-4BFD-B8BE-0972234354AC does
                        not Exist
                      errorType: UserDoesNotExist
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userGuid:
                  type: string
                  description: 'Unique identifier of the user. This can accept the
                    following:

                    - User''s GUID in the Cornerstone LMS. This was included as a
                    query parameter in the launch URL from Cornerstone. This is the
                    preferred identifier because Cornerstone enforces that no two
                    users share the same GUID.

                    - User''s ref in the Cornerstone LMS. This is a client-defined
                    user identifier. If multiple active users have the same ref, the
                    progress record will be associated with one of them.

                    - User''s email in the Cornerstone LMS. multiple active users
                    have the same email address, the progress record will be associated
                    with one of them.'
                courseId:
                  type: string
                  description: When sending progress to CSX (CSOD) - Course ID. When
                    sending progress to SBX (Saba) - GCID.
                status:
                  type: string
                  description: Indicates user's progress status.
                  enum:
                  - InProgress
                  - Completed
                userScore:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: User's score in percentage.
                totalTime:
                  type: string
                  format: time
                  description: 'Total time spent by the user on the course. Valid
                    formats are H:MM:SS, HH:MM:SS, HHH:MM:SS, and HHHH:MM:SS. '
                timesAccessed:
                  type: integer
                  description: Number of times accessed (total).
                  minimum: 1
                completionDate:
                  type: string
                  format: date-time
                  description: Date/time when the user completed the course. Cornerstone
                    stores this only when status = Completed.
                lastTimeAccessed:
                  type: string
                  format: date-time
                  description: Date/time when the user last accessed the course.
                successStatus:
                  type: string
                  description: Indicates if the user passed the course.
                  enum:
                  - Pass
                  - Fail
                bookmark:
                  type: string
                  description: The location the user has reached so far in the content
                    file.
                  maxLength: 2500
                suspendData:
                  type: string
                  description: Additional user experience data.
                  maxLength: 4800
                progress:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Course progress in percentage.
                registrationDate:
                  type: string
                  description: Date/time when the user registered.
                  format: date-time
              required:
              - userGuid
              - courseId
              - status
            examples:
              Example:
                value:
                - userGuid: 2BCA8706-E070-4BFD-B8BE-0972234354AB
                  courseId: ID7c0085c1-c9a3-448b-b1e5-766f2822222_0_990
                  status: Completed
                  userScore: 100
                  totalTime: 00:09:12
                  timesAccessed: 1
                  completionDate: '2018-09-17T14:51:01.798Z'
                  lastTimeAccessed: '2018-09-17T14:51:01.798Z'
                  successStatus: Pass
                  bookmark: string
                  suspendData: string
                  progress: 100
                  registrationDate: '2018-09-28T09:48:31.173Z'
      parameters:
      - schema:
          type: string
        in: header
        name: Authorization
        required: true
        description: 'Send the base64 encoded result of {username}:{password} in a
          "Basic" Authorization header. '
      - schema:
          type: string
        in: query
        name: sessionToken
        description: The course URL's sessionToken. Cornerstone provides this within
          the Launch URL parameters.
        required: true
  /token:
    post:
      summary: Obtain OAuth 2.0 Access Token
      description: 'This endpoint issues an access token using the OAuth 2.0 Client
        Credentials flow.

        '
      tags:
      - VILT Connector
      operationId: GetToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              - client_id
              - client_secret
              properties:
                grant_type:
                  type: string
                  enum:
                  - client_credentials
                  description: The grant type. For client credentials, set to "client_credentials".
                client_id:
                  type: string
                  description: The OAuth client identifier.
                client_secret:
                  type: string
                  description: The OAuth client secret.
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: The OAuth 2.0 access token
                  token_type:
                    type: string
                    description: Type of the token issued (usually "Bearer")
                  expires_in:
                    type: integer
                    description: Token expiry in seconds
        '400':
          description: Bad request (invalid credentials or parameters)
        '401':
          description: Unauthorized
        '500':
          description: Server error
