openapi: 3.0.1
info:
  contact:
    name: Cornerstone, Inc.
  license:
    name: Cornerstone, Inc.
    url: https://www.cornerstoneondemand.com/
  title: Webhook Event Payloads
components:
  schemas:
    TrainingItem:
      properties:
        data:
          properties:
            targetUserId:
              description: CSOD-generated integer identifier for whom the event is
                executed for
              format: int32
              type: number
            targetUserRef:
              description: User ID (seen on the CSOD UI) for whom the event is executed
                for
              type: string
            targetUserFirstName:
              description: User First Name for whom the event is executed for
              type: string
            targetUserLastName:
              description: User Last Name for whom the event is executed for
              type: string
            targetUsername:
              description: User Name for whom the event is executed for
              type: string
            targetUserDivisionRef:
              description: Division OU ID for whom the event is executed for
              type: string
            targetUserLocationRef:
              description: Location OU ID for whom the event is executed for
              type: string
            createdByUserId:
              description: CSOD-generated integer identifier for the user administering
                the event
              format: int32
              type: number
            createdByUserRef:
              description: User ID for the user administering the event
              type: string
            trainingId:
              description: Learning Object Id
              type: string
            trainingRef:
              description: Learning Object Ref
              type: string
            trainingTitle:
              description: Learning Object localized title
              type: string
            providerId:
              description: Provider Id
              type: string
            eventId:
              description: Event Id
              type: string
            eventDateTimestamp:
              description: Date when the event was created
              format: date-time
              type: string
            trainingActionDateTimestamp:
              description: Date for training action
              format: date-time
              type: string
            targetUserGuid:
              description: User Guid for whom the event is executed for
              type: string
            trainingRegistrationNumber:
              description: Learning Object registration number for the target user
              format: int32
              type: number
            isStandaloneOnTranscript:
              description: Flag indicating whether training exists as a standalone
                item on a user's transcript
              type: boolean
            transcriptUrl:
              description: Universal profile transcript link for target user
              type: string
            dueDateTimestamp:
              description: Date for training minimum due date
              format: date-time
              type: string
            trainingType:
              description: Learning Object training type code
              type: string
            subjects:
              description: Subjects assigned to the LO
              type: object
              properties:
                values:
                  type: array
                  items:
                    type: string
              example:
                values:
                - Math
                - Science
          type: object
      type: object
    TrainingEvents:
      title: Available Events
      enum:
      - TrainingAssigned
      - TrainingCompleted
      - TrainingRemoved
      - TrainingRestored
      - TrainingArchived
      - TrainingUnarchived
      - TrainingRegistered
      - TrainingApproved
      - TrainingDenied
      - TrainingStarted
      - TrainingWithdrawn
      - TrainingCancelled
      - TrainingExempt
      - TrainingExemptionRequested
      - TrainingExemptionApproved
      - TrainingExemptionDenied
      type: string
      example: TrainingAssigned
    TrainingEventItem:
      properties:
        headers:
          properties:
            corpName:
              type: string
            cloudCorpId:
              type: string
            actorId:
              format: int32
              type: number
            cultureId:
              format: int32
              type: number
            correlationId:
              type: string
            cultureName:
              type: string
            messageId:
              type: string
            tags:
              type: string
          type: object
      type: object
