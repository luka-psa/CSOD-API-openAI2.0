      allOf:
      - $ref: '#/components/schemas/TrainingEventItem'
      - properties:
          trainingAssigned:
            $ref: '#/components/schemas/TrainingItem'
            type: object
          lmsEventsCase:
            allOf:
            - $ref: '#/components/schemas/TrainingEvents'
            - default: TrainingAssigned
        type: object
    TrainingAssignedCallbackRecord:
      allOf:
      - $ref: '#/components/schemas/CallbackRecord'
      - properties:
          value:
            $ref: '#/components/schemas/TrainingAssignedItem'
        type: object
    TrainingAssignedRequest:
      allOf:
      - $ref: '#/components/schemas/CallbackRequest'
      - properties:
          records:
            items:
              $ref: '#/components/schemas/TrainingAssignedCallbackRecord'
            type: array
        type: object
      type: object
