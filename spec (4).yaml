openapi: 3.0.1
info:
  description: ''
  title: Reporting API
  version: ''
servers:
- description: Stage
  url: https://[corpname]-stg.csod.com/services/api/x/odata/api/views
- url: https://[corpname]-pil.csod.com/services/api/x/odata/api/views
  description: Pilot
- url: https://[corpname].csod.com/services/api/x/odata/api/views
  description: Production
components:
  parameters:
    count:
      description: Include count of items, see [Count](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptioncount)
      in: query
      name: $count
      schema:
        type: boolean
    search:
      description: Search items by search phrases, see [Searching](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionsearch)
      in: query
      name: $search
      schema:
        type: string
    skip:
      description: Skip the first n items, see [Paging - Skip](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionskip)
      in: query
      name: $skip
      schema:
        minimum: 0
        type: integer
    top:
      description: Show only the first n items, see [Paging - Top](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptiontop)
      example: 50
      in: query
      name: $top
      schema:
        minimum: 0
        type: integer
  responses:
    error:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
      description: Error
  schemas:
    count:
      anyOf:
      - type: number
      - type: string
      description: The number of entities in the collection. Available when using
        the [$count](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptioncount)
        query option.
    error:
      properties:
        error:
          properties:
            code:
              type: string
            details:
              items:
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  target:
                    type: string
                required:
                - code
                - message
                type: object
              type: array
            innererror:
              description: The structure of this object is service-specific
              type: object
            message:
              type: string
            target:
              type: string
          required:
          - code
          - message
          type: object
      required:
      - error
      type: object
