  /x/lms-learning-assignment/v1/learning-assignment/{id}:
    get:
      operationId: get-learning-assignment-id
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: ''
                properties:
                  assignNewOccurrence:
                    description: Select this option if users who already have the
                      training should be assigned a new occurrence.
                    type: boolean
                  bypassUserPayment:
                    description: Setting this value to true prevents users from being
                      prompted to pay for training. The training will be placed on
                      their transcripts and no payment is needed from the user. This
                      must be set to false (or omitted) unless trainingAssignmentWorkflow
                      is 'Register'.
                    type: boolean
                  cancellationdate:
                    description: Date the assignment was cancelled. If the assignment
                      has not been cancelled, this value is null.
                    format: date-time
                    type: string
                  comments:
                    description: Comments to appear in the Transcript History section
                      for each selected training.
                    minLength: 0
                    type: string
                  createDate:
                    description: Date the assignment was created.
                    format: date-time
                    type: string
                  creatorId:
                    description: ID of the assignment creator.
                    type: number
                  description:
                    description: Description of the assignment.
                    minLength: 0
                    type: string
                  dueDate:
                    description: The date when the training is due (in UTC). If not
                      specified, no due date. Cannot be in the past.
                    format: date-time
                    minLength: 0
                    type: string
                  emailOption:
                    description: The email settings that should be applied to the
                      assignment. If not specified, defaults to "NoEmails". NoEmails
                      - No emails will be sent to users. TrainingSpecific - Send emails
                      to users based on the email settings configured at the training
                      level. Enum:[ TrainingSpecific, NoEmails ]
                    minLength: 0
                    type: string
                  enforcePrerequisites:
                    description: Enforce prerequisites. When enabled, users not satisfying
                      training prerequisites will not receive the associated training.
                    type: boolean
                  id:
                    description: ID of the assignment
                    type: integer
                  isDynamic:
                    description: Indicates whether or not the assignment is dynamic.
                    type: boolean
                  learningObjectIds:
                    description: The list of learning objects to be assigned.
                    items:
                      type: string
                    type: array
                  maintainProgress:
                    description: Select this option if users who already have the
                      training should be associated with this assignment. Can only
                      be set to true if 'assignNewOccurrence' is set to true.
                    type: boolean
                  name:
                    description: Name of the assignment.
                    maxLength: 300
                    minLength: 1
                    type: string
                  overridePriorDueDates:
                    description: Select this option if users who already have this
                      training as a child training should have their prior due dates
                      overridden. Can only be set to true if 'assignNewOccurrence'
                      is set to true.
                    type: boolean
                  sendAssignTrainingEmails:
                    description: Select this option if Assign Training emails configured
                      at the LO level should be sent for the training in this assignment.
                      By default, this option is turned off. Can only be set if 'TrainingSpecific'
                      email option is chosen.
                    type: boolean
                  sendCurriculaRegisterTrainingEmails:
                    description: Curricula may contain training set to Auto-Register
                      upon registration of the Curriculum. You can suppress this Auto-Registration
                      action from sending additional emails to user by enabling this
                      option.
                    type: boolean
                  sendRegisterTrainingEmails:
                    description: 'Select this option if Register Training emails configured
                      at the LO level should be sent for the training in this assignment.
                      By default, this option is turned off. Note: The default value
                      of this option is defined by a backend setting. Can only be
                      set if ''TrainingSpecific'' email option is chosen.'
                    type: boolean
                  status:
                    description: 'This field displays the current status of the assignment.
                      For standard assignments, statuses include: Queued, Processed,
                      Cancelled, and Draft. For dynamic assignments, statuses include:
                      Active, Inactive, and Draft. Enum: [ Done, Queued, Cancelled,
                      Active, Inactive, Draft ]'
                    type: string
                  trainingAssignmentWorkflow:
                    description: Allowed values are Assign, Approve, Register, and
                      Complete. How training will be assigned to users. This affects
                      which status the training will be in on users transcripts. If
                      not specified, defaults to Register. Assign - The training will
                      only be assigned and may still require the user to receive approval
                      and register for the training before they can take the training.
                      Approve - The training will be automatically approved. No approval
                      will be necessary before users are allowed to take the training,
                      regardless of any configured approval workflows. Register -
                      The training will be automatically approved and registered,
                      regardless of any configured approval workflows. No approval
                      and no registration will be required before the users are allowed
                      to access the training. Complete - This option is only available
                      when assigning a session(s) which occurs in the past. The session(s)
                      will be added to users' transcripts in a status of Completed.
                      If any other training items are being assigned with the session(s),
                      this option is not available.
                    minLength: 0
                    type: string
                required:
                - name
                - learningObjectIds
                type: object
          description: OK
      summary: Get Assignment
      tags:
      - Learning Assignment
      description: 'Once you submit a learning assignment, you can check the status
        of your assignment using this endpoint.


        Note that it is not yet possible to use this GET endpoint to fetch the status
        of an Express Class created using the Express Class API (`/services/x/lms-express-class/v1/ExpressClass`).


        *Permissions Required*: Assignment Tool - Standard


        The API respects any constraints placed on the permission. For example, if
        the user making the API call is constrained to certain users via the permission,
        they can only retrieve assignments created by that user. The permission and
        any constraints must be placed on the user associated with your OAuth 2.0
        application.


        OAuth 2.0 Scope: `learningassignment:read`'
