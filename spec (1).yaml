openapi: 3.0.1
info:
  contact:
    name: Cornerstone, Inc.
  license:
    name: Cornerstone, Inc.
    url: https://www.cornerstoneondemand.com/
  title: Learning APIs
  version: EA/GA
  description: ''
servers:
- description: Stage
  url: https://psa-international-stg.csod.com/services/api/
- url: https://psa-international-pil.csod.com/services/api/
  description: Pilot
- url: https://psa-international.csod.com/services/api/
  description: Production
components:
  schemas:
    ActionDates:
      properties:
        AssignedDate:
          type: string
        CompletionDate:
          type: string
        DueDate:
          type: string
        ModificationDate:
          type: string
        RegistrationDate:
          type: string
        StatusChangeDate:
          type: string
      type: object
    AllUsers_globalsearch:
      properties:
        IncludeSubs:
          description: Include Subordinates
          type: boolean
      type: object
    AllUsers_lo:
      description: Availability to all users.
      properties:
        __type:
          description: Constant value- "AllUsers:www.CornerStoneOnDemand.com/Services/LMS"
          type: string
        IncludeSubs:
          description: true/false
          type: boolean
        PreApproved:
          description: true/false
          type: boolean
        RegisterUponApproval:
          description: true/false
          type: boolean
      type: object
    AllUsers_proxyenroll:
      properties:
        IncludeSubs:
          description: Include Subordinates
          type: boolean
      type: object
    AllUsers_trainingunit:
      properties:
        __type:
          description: Constant value- "AllUsers:www.CornerStoneOnDemand.com/Services"
          type: string
        Amount:
          description: Valid range 0.01 to999999.99. Optional
          format: decimal(9,2)
          type: number
      type: object
    ApprovalDetails:
      properties:
        Approvals:
          $ref: '#/components/schemas/ApprovalItem'
        ApprovalsSummaryUrl:
          description: URL
          type: string
      type: object
    ApprovalDetailsModel:
      allOf:
      - $ref: '#/components/schemas/CsodApiGetResponse_transcriptandtask'
      - properties:
          data:
            items:
              $ref: '#/components/schemas/ApprovalDetails'
            type: array
        type: object
    ApprovalItem:
      properties:
        ApprovalDateRequested:
          description: UTC DateTime (YYYY-MM-DD)
          type: string
        ApprovalTitle:
          description: Item Title
          type: string
        ApprovalUrl:
          description: URL
          type: string
        ApprovalUser:
          description: User Id
          type: string
      type: object
    AssignedTrainingDetails:
      properties:
        AssignedTrainings:
          $ref: '#/components/schemas/AssignedTrainingItem'
        AssignedTrainingsSummaryUrl:
          description: URL
          type: string
      type: object
    AssignedTrainingDetailsModel:
      allOf:
      - $ref: '#/components/schemas/CsodApiGetResponse_transcriptandtask'
      - properties:
          data:
            items:
              $ref: '#/components/schemas/AssignedTrainingDetails'
            type: array
        type: object
    AssignedTrainingItem:
      properties:
        AssignedTrainingUrl:
          type: string
        DueDate:
          description: UTC DateTime (YYYY-MM-DD)
          type: string
        LoId:
          description: Training Loid
          type: string
        Status:
          description: Training Status
          type: string
        Title:
          description: Training Title
          type: string
      type: object
    AvailableLanguageItem_globalsearch:
      properties:
        ID:
          description: Language Id e.g. en-US
          type: string
        Name:
          description: Language Name e.g. English (US)
          type: string
      type: object
    AvailableLanguageItem_lo:
      properties:
        Language:
          description: Must be a valid language title. For a list of valid values
            please see the Localization section of the Getting Started page in the
            API Explorer.
          type: string
        LanguageID:
          description: Must be a valid language code. For a list of valid values please
            see the Localization section of the Getting Started page in the API Explorer.
          type: string
      type: object
    CertSection:
      properties:
        EarnedCredits:
          format: int32
          type: number
        SectionItems:
          $ref: '#/components/schemas/SectionItem'
        SectionTitle:
          type: string
        Status:
          description: Obsolete. Will always blank.
          type: string
      type: object
    CertificationDetail:
      properties:
        CertificateCategory:
          description: Category of the certification.
          type: string
        CertificateFamily:
          description: Family of the certification.
          type: string
        CertificateTitle:
          description: Title of the certification
          type: string
        CertificationLoId:
          description: Learning Object ID (LOID) of the certification.
          type: string
        CreditsRequired:
          description: Credits required for the certification.
          format: int32
          type: number
        Sections:
          $ref: '#/components/schemas/CertificationSection'
        Version:
          description: Version of the certification
          format: int32
          type: number
      type: object
    CertificationResponse:
      properties:
        CertificationDetails:
          $ref: '#/components/schemas/CertificationDetail'
        Reason:
          type: string
        Result:
          type: string
      type: object
    CertificationResponseModel:
      allOf:
      - $ref: '#/components/schemas/CsodApiGetResponse_certificationdetails'
      - properties:
          data:
            $ref: '#/components/schemas/CertificationResponse'
        type: object
    CertificationSection:
      properties:
        MaxCredits:
          description: Maximum Credits that need to be acquired for completion this
            Section
          format: int32
          type: number
        MinCredits:
          description: Minimum Credits that need to be acquired for completion this
            Section
          format: int32
          type: number
        SectionItems:
          $ref: '#/components/schemas/CertificationSectionItem'
        SectionTitle:
          description: Title of the Section under the certification.
          type: string
        Sequence:
          description: Sequence of the Section within the Certification.
          format: int32
          type: number
      type: object
    CertificationSectionItem:
      properties:
        ItemCredits:
          description: Credits to be acquired by the user on completion of this Item(LO).
          format: int32
          type: number
        ItemLoId:
          description: Learning Object ID (LOID) of the item(LO) which is a part of
            the section.
          type: string
        ItemTitle:
          description: Title of the item (learning object) which is a part of the
            section.
          type: string
        Sequence:
          description: Sequence of the Item within the section of the Certification.
          format: int32
          type: number
        Type:
          description: LO Type of the item (learning object) which is a part of the
            section.
          type: string
      type: object
    CertificationTranscript:
      properties:
        CertificateTitle:
          description: Title of the certification.
          type: string
        CertificationDueDateSpecified:
          description: Due Date of the user's certification.
          format: YYYY-MMDDTHH:MM:SS
          type: string
        CertificationLoId:
          description: Learning Object ID (LOID) of the certification.
          type: string
        CertificationStatus:
          description: User's status for the certification. Possible values are (without
            the double quotes)- "In Progress", "Expired", "Certified", etc.
          type: string
        CreditsRequired:
          description: Credits required for the certification.
          format: int32
          type: number
        EarnedCredits:
          description: Credits actually acquired by the user on completion of the
            section.
          format: int32
          type: number
        ExpirationDateSpecified:
          description: Expiration Date of the user's certification.
          format: YYYY-MMDDTHH:MM:SS
          type: string
        Sections:
          $ref: '#/components/schemas/CertSection'
      type: object
    CertificationTranscriptResponse:
      properties:
        CertTransResult:
          type: string
        CertificationTransDetails:
          $ref: '#/components/schemas/CertificationTranscript'
        Reason:
          type: string
      type: object
    CertificationTranscriptResponseModel:
      allOf:
      - $ref: '#/components/schemas/CsodApiGetResponse_certificationtranscript'
      - properties:
          data:
            $ref: '#/components/schemas/CertificationTranscriptResponse'
        type: object
    Competency:
      properties:
        LoId:
          type: string
      type: object
    CompetencyItem:
      properties:
        Id:
          description: Competency Id
          type: string
        Title:
          description: Competency Title
          type: string
      type: object
    ContactId:
      properties:
        UserId:
          type: string
      type: object
    CsodApiGetResponse_certificationdetails:
      description: Response Template for all GET Operations Default Response Status
        if not set will be 200 - OK Default TimeStamp if not set will be the current
        server time in PST Response Data list and Total Count should be set by the
        service implementation
      properties:
        Status:
          format: int32
          type: number
        TimeStamp:
          type: string
        TotalRecords:
          format: int32
          type: number
        Validations:
          items:
            properties:
              Code:
                type: string
              Message:
                type: string
            type: object
          type: array
      type: object
      xml:
        name: cornerstoneApi
        namespace: http://www.w3.org/2001/XMLSchema-instance
        prefix: i
