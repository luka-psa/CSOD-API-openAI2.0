  /x/lms-learning-assignment/v1/learning-assignment/search:
    get:
      operationId: get-learning-assignment-search
      parameters:
      - description: The page number requested. Must be greater than zero.
        in: query
        name: PageNumber
        required: true
        schema:
          minimum: 1
          type: number
      - description: The amount of results to show per page. Max limit is 500.
        in: query
        name: PageSize
        required: true
        schema:
          maximum: 500
          type: number
      - description: 'The creation date filter start. ISO 8601 format with timezone
          offset: YYYY-MM-DDTHH:MM:SS+/-00:00. URL encoded example: 2020-01-01T00%3A00%3A00-08%3A00.'
        in: query
        name: CreationDateStart
        schema:
          format: date-time
          type: string
      - description: 'The creation date filter end. ISO 8601 format with timezone
          offset: YYYY-MM-DDTHH:MM:SS+/-00:00. URL encoded example: 2020-01-31T23%3A59%3A59-08%3A00.'
        in: query
        name: CreationDateEnd
        schema:
          format: date-time
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: ''
                properties:
                  data:
                    properties:
                      pageNumber:
                        description: The page number provided in the request
                        type: number
                      pageSize:
                        description: The page size provided in the request
                        type: number
                      resultCount:
                        description: The total number of assignments that satisfy
                          the criteria in the request
                        type: number
                      results:
                        description: The search results
                        items:
                          properties:
                            createDate:
                              minLength: 1
                              type: string
                            creationSource:
                              minLength: 1
                              type: string
                            creatorId:
                              type: number
                            id:
                              type: number
                            isDynamic:
                              type: boolean
                            status:
                              minLength: 1
                              type: string
                            title:
                              minLength: 1
                              type: string
                          required:
                          - id
                          - status
                          - title
                          - createDate
                          - creatorId
                          - isDynamic
                          - creationSource
                          type: object
                        minItems: 1
                        type: array
                        uniqueItems: true
                    required:
                    - results
                    - resultCount
                    - pageNumber
                    - pageSize
                    type: object
                  status:
                    minLength: 1
                    type: string
                  timestamp:
                    minLength: 1
                    type: string
                required:
                - status
                - timestamp
                - data
                type: object
          description: OK
      summary: Search Assignments
      tags:
      - Learning Assignment
      description: 'Use this endpoint to search for and retrieve details on an assignment
        created via the API or the Learning Assignment Tool in the UI.


        - Use the CreationDateStart and CreationDateEnd filters to fetch information
        about learning assignments created between those dates.

        - The API currently only supports retrieving data for standard assignments.
        You cannot retrieve information about dynamic assignments at this time.

        - Note that it is not yet possible to use this GET endpoint to fetch the status
        of an Express Class created using the Express Class API (/services/x/lms-express-class/v1/ExpressClass).


        *Permissions Required*: Assignment Tool - Standard


        The API respects any constraints placed on the permission. For example, if
        the user making the API call is constrained to certain users via the permission,
        they can only retrieve assignments created by that user. The permission and
        any constraints must be placed on the user associated with your OAuth 2.0
        application.


        OAuth 2.0 Scope: `learningassignment:read`

        '
  /x/lms-learning-assignment/v1/learning-assignment/standard:
    post:
      description: "Use this endpoint to create a standard learning assignment in\
        \ Cornerstone. You can add training to users' transcripts in Approved, Assigned,\
        \ and Registered status using this API.\n\nYou can also use the API to mark\
        \ a user as Complete in an ILT Session. In order to do this, the ILT Session's\
        \ end date must be in the past. Note that the API will not mark the ILT Session\
        \ as complete on a user\u2019s transcript if the ILT Session has prerequisites,\
        \ pre-work, or any approval workflows associated with it.\n\nThe API supports\
        \ assigning users to training of the following types: Cohort, Curriculum,\
        \ Event, Library, Material, Online Class, Online Course, Quick Course, Session,\
        \ Test, and Video.\n\nYou can only assign training that is in 'approved' status.\
        \ If you are assigning an ILT Session, the session's status must be 'approved'\
        \ or 'complete'.\n\nTraining that is inactive cannot be assigned using this\
        \ API.\n\nYou can only assign training to active users using this API.\n\n\
        Either orgUnits or users must be provided for the assignment.\n\nThe user\
        \ associated with your OAuth 2.0 application must have the 'availability'\
        \ to the training you are assigning using this API. If you are not familiar\
        \ with the concept of 'Availability' in Cornerstone Learning, please read\
        \ through [this help article](https://help.csod.com/help/csod_0/OnlineHelp.htm#Catalog/Course_Catalog/Course_Catalog_Availability.htm).\
        \ You must be logged into your Cornerstone portal to access this article.\n\
        \nThis API processes requests asynchronously. A successful response from the\
        \ API indicates that the request has been received and has been queued for\
        \ processing. Queues are shared by all clients in a given swimlane and as\
        \ such the time taken to process an assignment varies based on the number\
        \ of requests queued at any given time. You can check the status of your request\
        \ using the Get Assignment endpoint.\n\n*Permissions Required:*\n\n- Assignment\
        \ Tool - Standard\n- Assignment Tool - Email Settings - View (you need this\
        \ permission to create learning assignments with email notifications)\n- Assignment\
        \ Tool - Bypass User Payment (you need this permission to bypass user payment\
        \ if a training needs payment)\n\nThe API respects any constraints placed\
        \ on these permissions. For example, if the user making the API call is constrained\
        \ to certain users via the permission, they can only assign training to those\
        \ users via the API. The permission and any constraints must be placed on\
        \ the user associated with your OAuth 2.0 application.\n\nOAuth 2.0 Scope:\
        \ `learningassignment:create`\n"
      operationId: post-learning-assignment-standard
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              properties:
                assignNewOccurrence:
                  description: Select this option if users who already have the training
                    should be assigned a new occurrence.
                  type: boolean
                bypassUserPayment:
                  description: Setting this value to true prevents users from being
                    prompted to pay for training. The training will be placed on their
                    transcripts and no payment is needed from the user. This must
                    be set to false (or omitted) unless trainingAssignmentWorkflow
                    is 'Register'.
                  type: boolean
                comments:
                  description: Comments to appear in the Transcript History section
                    for each selected training.
                  minLength: 0
                  type: string
                description:
                  description: Description of the assignment.
                  minLength: 0
                  type: string
                dueDate:
                  description: The date when the training is due (in UTC). If not
                    specified, no due date. Cannot be in the past.
                  format: date-time
                  minLength: 0
                  type: string
                emailOption:
                  description: The email settings that should be applied to the assignment.
                    If not specified, defaults to "NoEmails". NoEmails - No emails
                    will be sent to users. TrainingSpecific - Send emails to users
                    based on the email settings configured at the training level.
                    Enum:[ TrainingSpecific, NoEmails ]
                  minLength: 0
                  type: string
                learningObjectIds:
                  description: The list of learning objects to be assigned.
                  items:
                    type: string
                  type: array
                maintainProgress:
                  description: Select this option if users who already have the training
                    should be associated with this assignment. Can only be set to
                    true if 'assignNewOccurrence' is set to true.
                  type: boolean
                name:
                  description: Name of the assignment.
                  maxLength: 300
                  minLength: 1
                  type: string
                overridePriorDueDates:
                  description: Select this option if users who already have this training
                    as a child training should have their prior due dates overridden.
                    Can only be set to true if 'assignNewOccurrence' is set to true.
                  type: boolean
                sendAssignTrainingEmails:
                  description: Select this option if Assign Training emails configured
                    at the LO level should be sent for the training in this assignment.
                    By default, this option is turned off. Can only be set if 'TrainingSpecific'
                    email option is chosen.
                  type: boolean
                sendRegisterTrainingEmails:
                  description: 'Select this option if Register Training emails configured
                    at the LO level should be sent for the training in this assignment.
                    By default, this option is turned off. Note: The default value
                    of this option is defined by a backend setting. Can only be set
                    if ''TrainingSpecific'' email option is chosen.'
                  type: boolean
                trainingAssignmentWorkflow:
                  description: Allowed values are Assign, Approve, Register, and Complete.
                    How training will be assigned to users. This affects which status
                    the training will be in on users transcripts. If not specified,
                    defaults to Register. Assign - The training will only be assigned
                    and may still require the user to receive approval and register
                    for the training before they can take the training. Approve -
                    The training will be automatically approved. No approval will
                    be necessary before users are allowed to take the training, regardless
                    of any configured approval workflows. Register - The training
                    will be automatically approved and registered, regardless of any
                    configured approval workflows. No approval and no registration
                    will be required before the users are allowed to access the training.
                    Complete - This option is only available when assigning a session(s)
                    which occurs in the past. The session(s) will be added to users'
                    transcripts in a status of Completed. If any other training items
                    are being assigned with the session(s), this option is not available.
                  minLength: 0
                  type: string
                users:
                  description: List of users who should be assigned the training.
                    Each 'user' object includes the properties 'id' and 'includeSubordinates'.
                    If 'includeSubordinates' is true, subordinate users will also
                    be assigned. The id should be the CSOD generated ID and not the
                    User ID (or Ref) you see in the Cornerstone UI. You can get the
                    CSOD generated ID through the Employee API.
                  items:
                    properties:
                      id:
                        type: number
                      includeSubordinates:
                        type: boolean
                    required:
                    - id
                    - includeSubordinates
                    type: object
                  minItems: 0
                  type: array
                  uniqueItems: true
                orgUnits:
                  description: List of organization units whose users should be assigned
                    the training. Each 'OU' object includes the properties 'id' and
                    'includeSubordinates'. If 'includeSubordinates' is true, subordinate
                    users of the child Organization Units will also be assigned. The
                    id should be the CSOD generated ID and not the OU ID you see in
                    the Cornerstone UI. You can get the CSOD generated ID through
                    the Employee/ OU API.
                  items:
                    properties:
                      id:
                        type: number
                      includeSubordinates:
                        type: boolean
                    required:
                    - id
                    - includeSubordinates
                    type: object
                  minItems: 0
                  type: array
                  uniqueItems: true
                requirementId:
                  description: Requirement Id. Tag the assignment as a required training.
                    Only available when Required Training Tagging features are activated.
                  type: integer
                  format: int32
              required:
              - name
              - learningObjectIds
              type: object
          application/xml:
            schema:
              properties: {}
              type: object
        description: ''
      responses:
        '201':
          content:
            application/json:
              schema:
                description: ''
                properties:
                  data:
                    properties:
                      assignmentId:
                        type: number
                    required:
                    - assignmentId
                    type: object
                  status:
                    minLength: 1
                    type: string
                  timestamp:
                    format: date-time
                    minLength: 1
                    type: string
                required:
                - status
                - timestamp
                - data
                type: object
