      description: Response Template for all PUT/UPDATE Operations Default Response
        Status if not set will be 202 - OK Default TimeStamp if not set will be the
        current server time in PST Total Updated/affected Count should be set by the
        service implementation
      properties:
        Validations:
          items:
            properties:
              Code:
                type: string
              Message:
                type: string
            type: object
          type: array
        status:
          format: int32
          type: number
        timeStamp:
          type: string
        updatedRecords:
          format: int32
          type: number
      type: object
    CurriculumTrainingItem:
      properties:
        AvailableLanguages:
          items:
            $ref: '#/components/schemas/AvailableLanguageItem_lo'
          type: array
        CurriculumPriceAmount:
          description: "Amount of the Curriculum Price (i.e. \u201C20.99\u201D)"
          type: number
        CurriculumPriceCurrency:
          description: "Currency of the Curriculum Price (i.e. \u201CUSD\u201D)"
          type: string
        CurriculumType:
          description: 'Curriculum Type: None, Hidden, Recommended, Required.'
          type: string
        DeepLinkURL:
          description: The full path of the Deeplink URL. Example - http://www.client.com/default.aspx?link=%2fdeeplink%2fssodeeplink.aspx%3fmodule%3dtranscript%26loid%3d4537069d-a298-470a-b156-0ab3681c8d12
          type: string
        Descr:
          description: Description that is found in the catalog
          type: string
        Duration:
          description: The duration, in minutes, of the Curriculum.
          type: string
        Fields:
          description: List of custom fields
          items:
            $ref: '#/components/schemas/Field'
          type: array
        LoDetails:
          description: List of LoDetailsWithinCurriculum.
          items:
            $ref: '#/components/schemas/LoDetailsWithinCurriculum'
          type: array
        ObjectId:
          description: "Cornerstone\u2019s LO ID."
          type: string
        Provider:
          description: The name of the LO provider.
          type: string
        Recommendations:
          items:
            $ref: '#/components/schemas/RecommendedTrainingDetails'
          type: array
        SectionDetails:
          items:
            $ref: '#/components/schemas/SectionDetail'
          type: array
        Subjects:
          items:
            $ref: '#/components/schemas/SubjectDetail'
          type: array
        Title:
          description: LO Title
          type: string
        Type:
          description: Comma Separated list of Training Type - Course - Event - Session
            - Material - Curriculum - Test Where Course = Online Class
          type: string
      type: object
    CurriculumTranscriptItem:
      allOf:
      - $ref: '#/components/schemas/TranscriptItem'
      - properties:
          CurriculumType:
            type: string
          LearningObjects:
            items:
              $ref: '#/components/schemas/LearningObjectItem'
            type: array
        type: object
    CustomFieldItem:
      properties:
        Title:
          description: Custom Field Title
          type: string
        Type:
          description: Custom Field Type
          type: string
        Value:
          description: Custom Field Value
          type: string
      type: object
    CustomFieldItemModel:
      allOf:
      - $ref: '#/components/schemas/CsodApiPostResponse_customfield'
      - properties:
          data:
            items:
              oneOf:
              - $ref: '#/components/schemas/LoCustomFieldItemR'
              - $ref: '#/components/schemas/UserCustomFieldItemR'
            type: array
        type: object
    CustomFieldItemRequestModel:
      properties:
        data:
          properties:
            record:
              items:
                oneOf:
                - $ref: '#/components/schemas/LoCustomFieldItem'
                - $ref: '#/components/schemas/UserCustomFieldItem'
              type: array
          type: object
      type: object
    CustomFieldServiceItem:
      properties:
        Tag:
          description: Include 'Email Tag' configured for the custom field in your
            portal.
          type: string
        Value:
          type: string
      type: object
    EventItemV1:
      properties:
        AbilityToSelectSessions:
          description: Controls the visibility of the 'Select Session' link for an
            Event on an end user's Transcript and Training Details. Allowed values
            are 1, 2 and 3. 1 = End Users, 2 = Admins and Managers, 3 = All.
          type: string
        AdvanceRegistrationPreApproved:
          description: This option is allow for Advance Registration PreApproved.
            true/false
          type: boolean
        AdvanceRegistrationRegister:
          description: This option is allow for Advance Registration Register. true/false
          type: boolean
        AdvancedRegistrationPeriod:
          description: This option is allow for Advanced Registration Period.
          format: int32
          type: number
        AllowAdvanceRegistration:
          description: This option is allow Advance Registration. true/false.
          type: boolean
        AllowWaitlist:
          description: This option to allow waitlists. true/false
          type: boolean
        CopyAvailabilityToNewSessions:
          description: This option to have sessions created for this event inherit
            the availability set at the event level. true/false
          type: boolean
        DefaultPrice:
          description: A default price for the training. The default price is what
            the user (or user's cost center) is charged when registering for training.
            Decimal value.
          format: decimal(9,2)
          type: number
        DefaultPriceCurrency:
          description: This is the price Cornerstone charges the client (the company,
            not the user) when the billing is reconciled.
          type: string
        Description:
          description: Enter an event description.
          type: string
        EventName:
          description: LO Name.
          type: string
        EventNumber:
          description: LO Number.
          type: string
        Keywords:
          description: Enter words to associate with the event. When a user searches
            and enters any of the keywords specified here, the course title will appear
            in the search results.
          type: string
        LoTrainPriceType:
          description: Lo Train Price Type. ACTIVE ,FUTURE
          type: string
        MaximumRegistration:
          description: Maximum number of registered users. This field is required.
          format: decimal(9,2)
          type: number
        MinimumRegistration:
          description: Minimum number of registered users. This field is required.
          format: decimal(9,2)
          type: number
        Objectives:
          description: Enter objectives if applicable.
          type: string
        OptionAllowInterestTracking:
          description: Allow interest tracking. Allowed values are true and false.
          type: boolean
        OptionAllowUsers:
          description: Allow users to attend multiple sessions. Allowed values are
            true and false.
          type: boolean
        OptionsActive:
          description: Indicates if Event is 'Active'. Allowed values are true and
            false.
          type: boolean
        PricingItems:
          items:
            $ref: '#/components/schemas/PricingItem'
          type: array
        PrimaryProviderName:
          description: Primary Provider Name.
          type: string
        RegistrationDeadlineNumber:
          description: Enter number of days/hours before the session start date when
            registration ends.
          format: int32
          type: number
        RegistrationDeadlinePeriod:
          description: Registration Deadline Period. Valid elements -Before, After
          type: string
        RegistrationDeadlineType:
          description: Registration Deadline Type. Valid elements -Minutes, Hours,
            Days, Week.
          type: string
        SecondaryProviderName:
          description: Secondary Provider Name.
          type: string
        StudentGrantedDays:
          description: This option is for number of days a user has to register for
            the session.
          format: int32
          type: number
        StudentGrantedHours:
          description: This option is for number of hours a user has to register for
            the session.
          format: int32
          type: number
        TrainingContactId:
          description: Training Contact Id.
          type: string
        TrainingUnitDefaultPrice:
          description: Allow users to check out with training units using the conversion
            rate that is determined by the monetary value. Decimal value.
          format: decimal(9,2)
          type: number
        TrainingUnitPricingItems:
          items:
            $ref: '#/components/schemas/TrainingUnitPricingItem'
          type: array
        WaitlistExpiresDays:
          description: This option is for number of days before registration deadline
            that the waitlist expires.
          format: int32
          type: number
        WaitlistExpiresHours:
          description: This option is for number of hours before registration deadline
            that the waitlist expires.
          format: int32
          type: number
      type: object
    EventTrainingItem:
      properties:
        AvailableLanguages:
          items:
            $ref: '#/components/schemas/AvailableLanguageItem_lo'
          type: array
        DeepLinkURL:
          description: The full path of the Deeplink URL. Example - http://www.client.com/default.aspx?link=%2fdeeplink%2fssodeeplink.aspx%3fmodule%3dtranscript%26loid%3d4537069d-a298-470a-b156-0ab3681c8d12
          type: string
        Descr:
          description: Description that is found in the catalog
          type: string
        Duration:
          description: The duration, in minutes, of the Event.
          type: string
        EventNumber:
          description: Event Number
          type: string
        Fields:
          description: List of custom fields
          items:
            $ref: '#/components/schemas/Field'
          type: array
        ObjectId:
          description: "Cornerstone\u2019s LO ID."
          type: string
        Objectives:
          description: The objectives.
          type: string
        PriceAmount:
          description: Amount of the Default Price of the LO
          type: number
        PriceCurrency:
          description: Currency of the Default Price of the LO.
          type: string
        Provider:
          description: The name of the LO provider.
          type: string
