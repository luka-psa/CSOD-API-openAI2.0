  /LOTranscript/TranscriptSearch:
    get:
      description: "The Transcript Search API gives you the ability to retrieve users\u2019\
        \ transcript information from Cornerstone Learning.\n\n*OAuth 2.0 Scope*:\
        \ `transcript:read`\n"
      parameters:
      - description: Learning Object (LO) Type that need to be retrieved.
        in: query
        name: LOType
        schema:
          type: string
      - description: "This will be the start of the time range needed.Will look at\
          \ the Transcript Modification Date on the user\u2019s transcript.Data for\
          \ a maximum of 24 hours can be retrieved.Format: YYYY - MM - DDTHH:MM: SS\
          \  Note*: This is an optional Field. If the field is used on the request,\
          \ it needs to have a value. Any Date field with a NULL value will cause\
          \ the call to error out."
        in: query
        name: ModificationStartDate
        schema:
          type: string
      - description: "This will be the end of the time range needed. Will look at\
          \ the Transcript Modification Date on the user\u2019s transcript.Data for\
          \ a maximum of 24 hours can be retrieved.Format: YYYY - MM - DDTHH:MM: SS\
          \ Note*: This is an optional Field. If the field is used on the request,\
          \ it needs to have a value. Any Date field with a NULL value will cause\
          \ the call to error out."
        in: query
        name: ModificationEndDate
        schema:
          type: string
      - description: Transcript Status of the Learning Object that needs to be retrieved.
          Required if LOID is not provided.
        in: query
        name: Status
        required: false
        schema:
          type: string
      - description: User ID of the user for whom the transcript data needs to be
          retrieved.
        in: query
        name: UserID
        schema:
          type: string
      - description: 'LOID of the Learning Object (LO). Note*: This field will be
          mandatory if Status is not provided. If Status & LOID both are provided
          in request, the response will be based on LOID. If Status is present & LOID
          is absent then response will be based on Status.'
        in: query
        name: LOID
        schema:
          type: string
      - description: Each page number represents a batch of up to 50 transcript records.
          So if pageNumber is not present or if pageNumber = 1, then up to the first
          50 transcript records will be returned. If pageNumber = 2, then up to the
          next 50 transcript records (records 51 to 100) will be returned. If pageNumber
          = 3, transcript records 101 up to 150 will be returned, and so on and so
          forth (the last page will more than likely not have 50 records).
        in: query
        name: PageNumber
        schema:
          type: number
      - description: The value must be a positive integer less than 1000. The default
          value is 50. If UseDataWarehouse is set to False, the maximum allowed PageSize
          is 50. If UseDataWarehouse is set to True, the maximum allowed page size
          is 1000.
        in: query
        name: PageSize
        schema:
          default: 50
          maximum: 1000
          type: number
      - description: Valid values are True/False. The default value is 'False'. Setting
          this value to 'True' should cause the API to include the ParentLOID field
          in the response. If a learning object (LO) is part of a Curriculum, Cohort
          or ILT Event (referred here as the Parent LO), the API should include the
          Parent LO's LOID in the response. If set to False, the API should not include
          the ParentLOID field in the response.
        in: query
        name: IncludeParentLOID
        schema:
          type: boolean
      - description: Valid values are True/False. The default value is 'False'. Setting
          this value to 'True' should cause the API to retrieve data from the Cornerstone
          data warehouse and allow you to specify a page size greater than 50. Setting
          this value to 'False' should cause the API to retrieve data from the Cornerstone
          transactional database with a maximum page size of 50 records.
        in: query
        name: UseDataWarehouse
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LOTranscriptItemResponseModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/LOTranscriptItemResponseModel'
          description: OK
      summary: Transcript Search
      tags:
      - Learning Search
  /TranscriptAndTask/Session:
