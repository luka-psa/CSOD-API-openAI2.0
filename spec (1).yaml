paths:
  /Catalog/GlobalSearch:
    get:
      description: "Use this API to retrieve training data based on your specific\
        \ search criteria.\n\n- If you include multiple query parameters in the request,\
        \ the API uses the AND operand. For example, if you send a course\u2019s title\
        \ and provider in the request, the API will only search for courses that have\
        \ both that title AND provider.\n\n- The API considers the language of the\
        \ user associated with the OAuth 2.0 application to determine the locale of\
        \ localized fields.\n\n- When the UserId query parameter is not provided,\
        \ the API does not evaluate LO availabilities. If the UserId parameter is\
        \ provided, the API evaluates and returns LO availabilities specific to the\
        \ given UserId in the response.\n\nPermission Required: `Course Catalog \u2013\
        \ View`\n\n*OAuth 2.0 Scope*: `training:read`        \n\n\n## Localization:\n\
        \nThe following request and response fields support localization. The API\
        \ considers the language of the user associated with the OAuth 2.0 application\
        \ to determine the locale for these fields.\n\n### Localized Request fields:\n\
        \n- Competency\n- Description\n- OU Type\n- Skills\n- Subject\n- Title\n-\
        \ Training Type\n\nIf the value included in the query parameter does not match\
        \ a localized value defined in your Cornerstone portal, the API will fall\
        \ back on the default language of the portal to validate the value you sent\
        \ in the query.\n\n### Localized Request fields:\n\n- Title\n- Description\n\
        - Subjects\n- CustomFields (Short Textbox and Scrolling Textbox)\n- Competencies\n\
        - Skills\n- TrainingPurposes\n"
      parameters:
      - description: Training Title
        in: query
        name: Title
        schema:
          type: string
      - description: Training Description
        in: query
        name: Description
        schema:
          type: string
      - description: 'Comma separated list of Training Type: Course, SCO, Curriculum,
          Library, Material, Test, Closed, Event, Video,SocialLearningProgram.  Where  Course  =  Online  Class,  SCO  =  Quick
          Course, SocialLearningProgram  =  Program. Default  is  ''All''.'
        in: query
        name: TrainingType
        schema:
          type: string
      - description: Subject Title
        in: query
        name: Subject
        schema:
          type: string
      - description: Provider Title
        in: query
        name: Provider
        schema:
          type: string
      - description: Comma separated list of Language Ids e.g. en-US, en-GB, fr-FR,
          Default is 'All Languages'
        in: query
        name: Languages
        schema:
          type: string
      - description: Comma separated list of Skill Titles
        in: query
        name: Skills
        schema:
          type: string
      - description: Location Id
        in: query
        name: Location
        schema:
          type: string
      - description: Comma separated list of Competency Titles
        in: query
        name: Competency
        schema:
          type: string
      - description: Instructor Id
        in: query
        name: Instructor
        schema:
          type: string
      - description: UTC DateTime (YYYY-MM-DD). Learning  object  creation  date  (from).  This  is  for  the
          ability to  search  by  a   date    range   on  when the LO  was created  in  the
          portal.
        in: query
        name: FromDate
        schema:
          type: string
      - description: UTC DateTime (YYYY-MM-DD). Learning  object  creation  date  (until/to).  This  is  for  the
          ability to  search  by  a   date    range   on  when the LO  was created  in  the
          portal.
        in: query
        name: ToDate
        schema:
          type: string
      - description: "Comma  separated  list  of  Ou  Ids.  Allows  the   ability\
          \ to  search  for  trainings   that    are available to  an  OU or   OU\u2019\
          s.If  this    field is populated, the OuType  field   should  be  populated\
          \ as well."
        in: query
        name: OuId
        schema:
          type: string
      - description: Comma separated list of Ou Types. OU  Type  of  the  OU  in  the  OuId  field.  If  this  field  is
          populated, the OuType  field   should  be populated as well.
        in: query
        name: OuType
        schema:
          type: string
      - description: Comma separated list of User Ids
        in: query
        name: UserId
        schema:
          type: string
      - description: true/false , if true it pulls InActive Trainings
        in: query
        name: IncludeInactive
        schema:
          type: string
      - description: true/false , if true it pulls all versions of Trainings
        in: query
        name: IncludeAllVersions
        schema:
          type: string
      - description: Positive integer number, Page size = 25 records
        in: query
        name: PageNumber
        schema:
          format: int32
          type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSearchTrainingItemModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/GlobalSearchTrainingItemModel'
          description: OK
      summary: Catalog Search
      tags:
      - Learning Search
  /SessionRoster/GetSessionRoster:
    get:
      description: 'This endpoint allows you to retrieve the roster details of an
        ILT Session.


        ### Localization:


        The following response fields support localization. The API considers the
        language of the user associated with the OAuth 2.0 application to determine
        the locale for these fields.


        - OUs>Name

        - OUs>TypeName

        - Attendance>PartName

        - Status


        *Permission Required*: `Roster - View`


        *OAuth 2.0 Scope*: `sessionroster:read`'
      parameters:
      - description: Locator id of the session. Required if sessionLOID/sessionNumber
          not provided.
        in: query
        name: locator
        required: true
        schema:
          format: int32
          type: number
      - description: LOID of Session. Required if locator/sessionNumber not provided.
        in: query
        name: sessionLOID
        schema:
          type: string
      - description: Session number of a given session. Required if locator/sessionLOID
          not provided.
        in: query
        name: sessionNumber
        schema:
          type: string
      - description: User status in the roster of a given session
        in: query
        name: status
        schema:
          type: string
      - description: Page Number of the result set. Default is 1
        in: query
        name: page
        required: true
        schema:
          format: int32
          type: number
      - description: No of records in a result set. Default or max value is 25
        in: query
        name: pageSize
        required: true
        schema:
          format: int32
          type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRosterResponseViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/SessionRosterResponseViewModel'
          description: OK
      summary: Get Session Roster Details
      tags:
      - Session Roster
  /SessionRoster/:
    post:
      description: 'This endpoint allows you to update the session attendance roster
        as well as complete the session.


        *OAuth 2.0 Scope*: `sessionroster:create`

        '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRosterItemRequestModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/SessionRosterItemRequestModel'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRosterResponseModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/SessionRosterResponseModel'
          description: OK
      summary: SubmitSessionRoster
      tags:
      - Session Roster
  /TranscriptAndTask/Approval:
    get:
      description: 'Use this endpoint to retrieve the pending approvals for a manager
        or approver.


        *OAuth 2.0 Scope*: `approval:read`

        '
      parameters:
      - description: User ID
        in: query
        name: UserId
        required: true
        schema:
          type: string
      - description: UTC DateTime (YYYY-MM-DD)
        in: query
        name: ApprovalDateRequested
        schema:
          type: string
      - description: Positive integer, Page size = 50 records
        in: query
        name: PageNumber
        schema:
          format: int32
          type: number
      - description: An optional field to define response language.
        in: query
        name: Language
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDetailsModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApprovalDetailsModel'
          description: OK
      summary: GetApprovals
      tags:
      - Transcript and Task
  /TranscriptAndTask/Assigned:
    get:
      description: 'Use this endpoint to retrieve all training assigned to a user,
        along with their statuses and due dates as applicable.


        *OAuth 2.0 Scope*: `transcript:read`

        '
      parameters:
      - description: User ID
        in: query
        name: UserId
        required: true
        schema:
          type: string
      - description: "\u2022 Expired \u2022 Complete \u2022 In progress \u2022 Not\
          \ started"
        in: query
        name: Status
        schema:
          type: string
      - description: UTC DateTime (YYYY-MM-DD)
        in: query
        name: DueDate
        schema:
          type: string
      - description: true/false
        in: query
        name: AssignedOnly
        schema:
          type: string
      - description: An optional field to define response language.
        in: query
        name: Language
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignedTrainingDetailsModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/AssignedTrainingDetailsModel'
          description: OK
      summary: GetAssignedTrainings
      tags:
      - Transcript and Task
