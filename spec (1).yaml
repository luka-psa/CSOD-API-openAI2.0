      summary: Update Transaction
      tags:
      - LMS Transactions
      description: "The Transaction Order API allows you to update an existing transaction\
        \ record. You can change its status\u2014 such as from Pending Payment to\
        \ Completed or Denied\u2014 and modify other details, including custom transaction\
        \ fields.\n\nThis API uses a sync + asynchronous approach:\n- General validation\
        \ and transaction updates are processed synchronously\n- Related tasks like\
        \ transcript updates and email triggers are executed in the background\n\n\
        Business Rules:\n  - Transaction record (unique Transaction ID) must exist\n\
        \  - Current status must be \"Pending Payment\" to update status\n  - If updating\
        \ status, new status must be either \"Completed\" or \"Denied\"\n  - Only\
        \ one transaction record can be updated per API call\n  - Custom fields support\
        \ only Short Text Box and Dropdown types\n  - Email tag name must be provided\
        \ as custom field name\n\nEmail Triggers:\n  Successfully calling this API\
        \ will trigger the \"Order Status Adjusted\" email as configured in the portal.\n\
        \nPermissions required: `Order History Details - update`\n\nThe API respects\
        \ any constraints placed on the permission. The permission and any constraints\
        \ must be placed on the user associated with your OAuth 2.0 application.\n\
        \nScope: `transaction:update`"
