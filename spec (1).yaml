  /x/lms-express-class/v1/ExpressClass:
    post:
      description: "This API processes requests asynchronously. A successful response\
        \ from the API indicates that the request has been received and has been queued\
        \ for processing. Queues are shared by all clients in a given swimlane and\
        \ as such the time taken to process a queued request varies based on the number\
        \ of requests queued at any given time. \n\nPermission Required: `Express\
        \ Class \u2013 Manage`\n\nThe API respects any constraints placed on the permission.\
        \ For example, if the user making the API call is constrained to certain users\
        \ via the permission, they can only submit an Express Class for those users\
        \ via the API. The permission and any constraints must be placed on the user\
        \ associated with your OAuth 2.0 application.\n\nOAuth 2.0 Scope: `expressclass:create`"
      operationId: post-ExpressClass
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                UserObservations:
                  description: List of attendee observations
                  minItems: 1
                  type: array
                  uniqueItems: true
                  items:
                    type: object
                    properties:
                      comment:
                        type: string
                        minLength: 1
                        description: The comment recorded for an Express Class attendee.
                          Maximum comment length 3000.
                        maxLength: 3000
                      score:
                        type: number
                        description: The score recorded for an Express Class attendee.
                          Integer value from 0-99999.
                        minimum: 0
                        maximum: 99999
                      observedTrainingHours:
                        type: string
                        description: The observed training hours and minutes recorded
                          for an Express Class attendee in ISO 8601 duration format.
                          For example, PT1H30M for 1 hour, 30 minutes. Total observed
                          training time should not exceed 99999 hours.
                        format: duration
                      status:
                        type: string
                        minLength: 1
                        description: 'The status recorded for an Express Class attendee.
                          Statuses: `Passed`, `Failed`, `Incomplete`.'
                        enum:
                        - Passed
                        - Failed
                        - Incomplete
                      userId:
                        type: number
                        description: The ID of an Express Class attendee. Internal
                          Id. Retrieve the internal id from Employee Api.
                    required:
                    - status
                    - userId
                completionDate:
                  description: The date and time of the Express Class submission.
                    UTC format only. Format YYYY-MM-DDThh:mm:ss.FFFZ
                  format: date-time
                  minLength: 1
                  type: string
                facilitatorUserId:
                  description: The ID of the facilitator submitting the Express Class.
                    Internal id. Retrieve the internal id from Employee Api.
                  type: number
                objectId:
                  description: The ID of the training submitting an Express Class
                    for.
                  minLength: 1
                  type: string
              required:
              - UserObservations
              - completionDate
              - facilitatorUserId
              - objectId
      responses:
        '200':
          content:
            application/json:
              schema:
                description: ''
                properties:
                  expressClassId:
                    description: The ID of a submitted Express Class.
                    minLength: 1
                    type: string
                  proxyId:
                    description: The ID of the proxy (LAT) assignment of a submitted
                      Express Class.
                    type: number
                  usersSubmitted:
                    description: Number of Users Submitted for observation.
                    type: number
                required:
                - expressClassId
                - proxyId
                - usersSubmitted
                type: object
          description: OK
      summary: Create Express Class
      tags:
      - Express Class
