  /CustomField/:
    post:
      description: "<p>Use this endpoint to load values to training custom fields\
        \ at either the Learning Object (LO) level or the Transcript level.</p><ul><li>A\
        \ maximum of 50 records can be in each request.</li><li>Each request can update\
        \ either the LO level custom field or the Transcript level Custom field, but\
        \ not both. In other words, updates for the LO level custom fields and the\
        \ updates for the Transcript level custom fields must be made in separate\
        \ API calls.</li><li>Blank values do not overwrite populated values. </li></ul>\n\
        <p>Below is a list of custom field types that you can update using this API\
        \ along with any associated rules:</p> <table>  <tbody><tr>    <th><b>Custom\
        \ Field Type<b></b></b></th>    <th><b>Field Requirements<b></b></b></th>\
        \  </tr>  <tr>    <td>Checkbox</td>    <td>To check, value must be \u201C\
        true\u201D (without double quotes) value.To uncheck, value must be \"false\"\
        \ (without doublequotes).</td>  </tr>   <tr>    <td>Date Field </td>    <td>Value\
        \ must be in the following format: MM-DD-YYYY.</td>  </tr>   <tr>    <td>Dropdown</td>\
        \    <td>Value must match one of the field\u2019s dropdown values</td>  </tr>\
        \   <tr>    <td>Numeric Field </td>    <td>Value must be a numeric value.\
        \ Decimals are acceptable.</td>  </tr>  <tr>    <td>Radio Button</td>    <td>Value\
        \ must match one of the field\u2019s radio buttonvalues.</td>  </tr>  <tr>\
        \    <td>Scrolling Text Box</td>    <td>Value can be a maximum of 2,000 characters.</td>\
        \  </tr>  <tr>    <td>Short Text Box</td>    <td>Value can be a maximum of\
        \ 100 characters.</td>  </tr>  </tbody></table>\n\n*OAuth 2.0 Scope*: `training:create`\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldItemRequestModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/CustomFieldItemRequestModel'
        required: false
      responses:
