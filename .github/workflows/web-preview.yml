# Builds the Hearth web app (Kotlin/Wasm) and publishes the finished site to the `hearth-web`
# branch. Vercel's Git integration deploys that branch as plain static files: Vercel itself has
# no Java, so it cannot run the Gradle build.
name: Web preview

on:
  push:
    branches: [hearth-household-assistant]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      # Optional: Google sign-in in the web preview (docs/GOOGLE.md). The Android app needs none.
      HEARTH_GOOGLE_WEB_CLIENT_ID: ${{ vars.HEARTH_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      # The shared relay's address, baked into the web and Android builds (sync, ChatGPT/Claude). The repository
      # variable HEARTH_RELAY_URL when set (e.g. a custom domain); otherwise the address the "Deploy relay" workflow
      # gives it on the same Cloudflare account: https://hearth-relay.<account's subdomain>.workers.dev.
      - name: Find the relay
        env:
          RELAY_URL: ${{ vars.HEARTH_RELAY_URL }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$RELAY_URL" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty') || sub=""
            if [ -n "$sub" ]; then RELAY_URL="https://hearth-relay.$sub.workers.dev"; fi
          fi
          echo "HEARTH_RELAY_URL=$RELAY_URL" >> "$GITHUB_ENV"
          if [ -n "$RELAY_URL" ]; then
            echo "::notice::Relay: $RELAY_URL"
          else
            echo "::warning::No relay: this build can't sync or link ChatGPT/Claude. Add the Cloudflare secrets (relay/README.md)."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test shared code (JVM + WebAssembly)
        run: ./gradlew :core:data:jvmTest :core:tools:jvmTest :ai:jvmTest :mcp:jvmTest :google:jvmTest :core:tools:wasmJsNodeTest :ai:wasmJsNodeTest

      - name: Relay tests (Worker in workerd)
        run: |
          cd relay && npm install && npm test

      - name: Build web app
        run: ./gradlew :web:wasmJsBrowserDistribution

      # The Android app, signed with the family key (app/hearth-family.jks) so updates install over it.
      - name: Build Android app
        run: ./gradlew :app:assembleRelease

      - name: Prepare site
        run: |
          mkdir -p site
          cp -r web/build/dist/wasmJs/productionExecutable/. site/
          find site -name '*.map' -delete
          cp app/build/outputs/apk/release/app-release.apk site/hearth.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hearth-web
          path: site

      - uses: actions/upload-artifact@v4
        with:
          name: hearth-android
          path: app/build/outputs/apk/release/app-release.apk

      # The deploy branch only ever holds the latest build (one commit, replaced each time).
      # The commit is authored as the person who pushed: Vercel (Hobby plan) only deploys
      # commits from authors on the Vercel account and blocks bot-authored ones.
      - name: Publish to the hearth-web branch
        working-directory: site
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          AUTHOR_NAME: ${{ github.actor }}
          AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          git init -q -b hearth-web
          git add -A
          git -c user.name="$AUTHOR_NAME" -c user.email="$AUTHOR_EMAIL" \
            commit -q -m "Hearth web build from ${GITHUB_SHA::7}"
          git push -q -f "$REPO_URL" hearth-web
