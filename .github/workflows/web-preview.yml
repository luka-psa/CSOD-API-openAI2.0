# Builds the Hearth web app (Kotlin/Wasm) and publishes the finished site to the `hearth-web`
# branch. Vercel's Git integration deploys that branch as plain static files: Vercel itself has
# no Java, so it cannot run the Gradle build.
name: Web preview

on:
  push:
    branches: [hearth-household-assistant]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test shared code (JVM + WebAssembly)
        run: ./gradlew :core:tools:jvmTest :ai:jvmTest :core:tools:wasmJsNodeTest :ai:wasmJsNodeTest

      - name: Build web app
        run: ./gradlew :web:wasmJsBrowserDistribution

      - name: Prepare site
        run: |
          mkdir -p site
          cp -r web/build/dist/wasmJs/productionExecutable/. site/
          find site -name '*.map' -delete

      - uses: actions/upload-artifact@v4
        with:
          name: hearth-web
          path: site

      # The deploy branch only ever holds the latest build (one commit, replaced each time).
      - name: Publish to the hearth-web branch
        working-directory: site
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git init -q -b hearth-web
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Hearth web build from ${GITHUB_SHA::7}"
          git push -q -f "$REPO_URL" hearth-web
